name: api-6

services:
  postgres:
    image: postgres:17-alpine
    container_name: api6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # LGPD hardening: enforce SCRAM-SHA-256 password authentication
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to localhost only so the database is never exposed on the local network.
      # POSTGRES_PORT in .env changes only the host-side port.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP, so the probe cannot succeed against the
      # temporary socket-only server postgres runs during first-time init
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres-tombstone:
    image: postgres:17-alpine
    container_name: api6-postgres-tombstone
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TOMBSTONE_DB:-api6_tombstone}
      POSTGRES_USER: ${TOMBSTONE_USER:-api6_tombstone}
      POSTGRES_PASSWORD: ${TOMBSTONE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - tombstone_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TOMBSTONE_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  mongodb:
    # 8.2+ required: MongoDB 8.0 cannot start on Linux kernel 6.19+ (SERVER-121912)
    image: mongo:8.2
    container_name: api6-mongodb
    restart: unless-stopped
    environment:
      # LGPD hardening: authentication is mandatory (no anonymous access)
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    ports:
      # Bound to localhost only so the database is never exposed on the local network.
      # MONGO_PORT in .env changes only the host-side port.
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    healthcheck:
      # Authenticated ping, so the probe cannot succeed against the
      # temporary pre-auth server mongo runs during first-time init
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama
    container_name: api6-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-pull:
    image: ollama/ollama
    container_name: api6-ollama-pull
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33
    container_name: api6-mailpit
    restart: unless-stopped
    ports:
      # Web UI with the captured e-mails, localhost only; SMTP (1025) stays inside the Docker network
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api6-django
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py migrate --database=tombstone && python manage.py ensure_superuser && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
      TOMBSTONE_HOST: ${TOMBSTONE_HOST:-postgres-tombstone}
      TOMBSTONE_PORT: "5432"
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: "27017"
      # Development e-mails go to the Mailpit container unless .env points to a real SMTP service
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
    volumes:
      - .:/app
    ports:
      # Localhost only, like the databases; host port configurable via API_PORT in .env
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  postgres_data:
  tombstone_data:
  mongo_data:
  ollama_data:
